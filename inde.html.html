<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h1{
        color: red;
        font-family: sans-serif;
    }
    button{
        padding: 12px 32px;
        border: none;
    }
    .btn1{
        background-color: red;
        border-radius: 10px;
        cursor:pointer;
        color: white;
    }
    .btn2{
        background-color: blue;
        border-radius: 10px;
        color: white;
        cursor: pointer;
    }
    .btn3{
        color: black;
        background-color: transparent;
        border-radius: 30px;
        cursor: pointer;
        border: 1px solid black;
    }
    .btn4{
        background-color: brown;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        transition: all 1s;
    }
    .btn4:hover{
        background-color: black;
    }
    .btn5{
        background-color: blueviolet;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        transition: all 0.3s;
    }
    .btn5:hover{
        background-color: transparent;
        color: black;
        outline: 1px solid black;
    }
    .btn6{
        background-color: gray;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s;
    }
    .btn6:hover{
        background-color: tomato;
        outline: 1px solid black;
    }
    .btn7{
        background-color: yellow;
        border-radius: 10px;
        cursor: pointer;
        border: 1px solid black;
        transition: all 0.3s;
    }
    .btn7:hover{
        background-color: black;
        color:white;
        transform: scale(0.9);
    }
    .btn8{
        background-color: black;
        border-radius: 10px;
        cursor: pointer;
        color: white;
        border: 1px solid red;
        transition: all 0.3s;
    }
    .btn8:hover{
        transform: rotate(20deg);
        background-color: pink;
    }
    .btn9{
        background-color: tomato;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s;
    }
    .btn9:hover{
        transform: rotate(-20deg);
        background-color: aqua;
    }
</style>
<body>
    <h1>Primary-1</h1>
    <div>
        <button class="btn1">Primary-btn</button>
        <button class="btn2">Primary-btn</button>
        <button class="btn3">Primary-btn</button>
    </div>
    <h1>Primary-2</h1>
     <div>
        <button class="btn4">Primary-btn</button>
        <button class="btn5">Primary-btn</button>
        <button class="btn6">Primary-btn</button>
    </div>
    <h1>Primary-3</h1>
     <div>
        <button class="btn7">Primary-btn</button>
        <button class="btn8">Primary-btn</button>
        <button class="btn9">Primary-btn</button>
    </div>

</body>
</html>
